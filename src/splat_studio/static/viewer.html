<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splat Viewer</title>
<link rel="stylesheet" href="./design.css">
<style>
  html, body { height: 100%; overflow: hidden; background: var(--canvas); }
  :root[data-bg="light"] body { background: var(--canvas-light); }
  canvas { display: block; touch-action: none; }
  .dock { position: fixed; left: var(--s-4); right: var(--s-4); display: flex; gap: var(--s-2); align-items: flex-start;
    pointer-events: none; z-index: 2; }
  .dock > * { pointer-events: auto; }
  .top { top: var(--s-4); justify-content: space-between; }
  .bottom { bottom: var(--s-4); justify-content: center; flex-wrap: wrap; align-items: stretch; }
  .title { display: flex; flex-direction: column; gap: 2px; min-width: 0; max-width: 60vw; }
  .title b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .right { display: flex; gap: var(--s-2); }
  a.back { text-decoration: none; display: flex; }
  #cropRange { align-self: center; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; z-index: 3; pointer-events: none; }
  #overlay .box { min-width: 260px; }
  .err { color: #ff8a80; max-width: 520px; white-space: pre-wrap; font: var(--text-meta); }
  .tt { position: fixed; bottom: calc(var(--s-4) + 48px); left: 50%; transform: translateX(-50%); z-index: 4;
    display: flex; flex-direction: column; gap: var(--s-2); min-width: 300px; }
  .tt[hidden] { display: none; }
  .tt-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
  .tt-row .hud-bar { border: var(--hairline) solid var(--hud-rule); }
  .tt-actions { display: flex; justify-content: flex-end; gap: var(--s-2); margin-top: var(--s-1); }
  .cov-map { position: fixed; left: var(--s-4); top: calc(var(--s-4) + 64px); z-index: 2; width: 168px;
    display: flex; flex-direction: column; gap: 4px; }
  .cov-map[hidden] { display: none; }
  .cov-map .hud-sub { white-space: normal; }
  .cov-map .warn { color: var(--signal); }
  .cov-globe { position: relative; width: 100%; aspect-ratio: 1; }
  .cov-wait { display: none; align-items: center; justify-content: center; gap: var(--s-2); width: 100%; aspect-ratio: 1; text-align: center; }
  .cov-map[data-state="loading"] .cov-wait, .cov-map[data-state="failed"] .cov-wait { display: flex; flex-direction: column; }
  .cov-map:not([data-state="ready"]) .cov-globe, .cov-map:not([data-state="ready"]) .cov-key { display: none; }
  .cov-map[data-state="failed"] .spin { display: none; }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--hud-ink-2) 35%, transparent);
    border-top-color: var(--signal); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
  .cov-globe canvas { display: block; width: 100% !important; height: 100% !important; }
  /* the middle of the globe is your point of view */
  .cov-globe::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border: 2px solid var(--signal); border-radius: 50%; pointer-events: none; }
  .cov-key { display: flex; gap: 8px; flex-wrap: wrap; }
  .cov-key i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
  @media (max-width: 640px) { .cov-map { width: 128px; top: calc(var(--s-2) + 60px); left: var(--s-2); } }
  .app-only { display: none !important; }
  body.app .app-only { display: flex !important; }
  @media (max-width: 640px) { .hide-sm { display: none !important; } .dock { left: var(--s-2); right: var(--s-2); } .bottom { bottom: var(--s-2); }
    .hud button { padding: 0 9px; } }
</style>
<script src="./i18n.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/",
    "@sparkjsdev/spark": "./vendor/spark/spark.module.min.js"
  }
}
</script>
</head>
<body class="hud">
<div class="marks" aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:1"></div>
<div class="dock top">
  <div class="hud-chip pad title"><b id="title" class="hud-title" data-i18n="viewer.loading">Loading…</b><span id="stats" class="hud-sub">&nbsp;</span></div>
  <div class="right">
    <div class="hud-chip hud-bar"><span data-lang-switcher></span></div>
    <div class="hud-chip hud-bar app-only"><a class="back" href="/"><button data-i18n="viewer.studio">← Studio</button></a></div>
  </div>
</div>

<div class="dock bottom">
  <div class="hud-chip hud-bar">
    <button id="reset" data-i18n="viewer.reset" data-i18n-title="viewer.reset.title">Reset view</button>
    <button id="spin" data-i18n="viewer.spin" data-i18n-title="viewer.spin.title">Auto-rotate</button>
    <button id="covBtn" hidden data-testid="cov-toggle" data-i18n="viewer.coverage" data-i18n-title="viewer.coverage.title">Coverage</button>
  </div>
  <div class="hud-chip hud-bar" data-i18n-title="viewer.orient.title">
    <button id="flip" data-i18n="viewer.flip">Flip</button>
    <button id="rotx" data-i18n="viewer.tilt">Tilt 90°</button>
    <button id="rotz" class="hide-sm" data-i18n="viewer.roll">Roll 90°</button>
  </div>
  <div class="hud-chip hud-bar" data-i18n-title="viewer.crop.title">
    <button id="crop" data-testid="crop-toggle" data-i18n="viewer.crop">Crop</button>
    <input id="cropRange" type="range" min="40" max="300" value="120" hidden aria-label="Crop">
  </div>
  <div class="hud-chip hud-bar">
    <button id="bg">Light</button>
    <button id="full" class="hide-sm" data-i18n="viewer.fullscreen">Fullscreen</button>
  </div>
  <div class="hud-chip hud-bar app-only">
    <button id="save" data-i18n="viewer.save" data-i18n-title="viewer.save.title">Save view</button>
    <button id="download" data-i18n="viewer.download">Download</button>
    <button id="turntable" data-testid="tt-open" data-i18n="tt.open" data-i18n-title="tt.open.title">Turntable video</button>
    <button id="export" class="primary" data-i18n="viewer.export" data-i18n-title="viewer.export.title">Export website</button>
  </div>
</div>

<div id="covMap" class="cov-map hud-chip pad" hidden data-testid="cov-map">
  <div class="hud-sub"><b data-i18n="viewer.coverage">Coverage</b> <span id="covWho"></span></div>
  <div class="cov-wait hud-sub" id="covWait" role="status" data-testid="cov-loading"><span class="spin" aria-hidden="true"></span><span id="covWaitText"></span></div>
  <div class="cov-globe" id="covGlobe" role="img" data-i18n-aria-label="viewer.coverage.title"></div>
  <div class="hud-sub cov-key"><span><i id="covKeyOk"></i><span data-i18n="viewer.coverage.filmed">filmed</span></span><span><i id="covKeyBad"></i><span data-i18n="viewer.coverage.missed">missed</span></span></div>
  <div class="hud-sub" id="covNote" data-testid="cov-note"></div>
</div>

<div id="ttPanel" class="tt hud-chip pad" hidden data-testid="tt-panel">
  <div class="hud-title" data-i18n="tt.title">Turntable video</div>
  <div class="hud-sub" data-i18n="tt.help">The model turns a full circle from this view.</div>
  <div class="tt-row"><span class="hud-sub" data-i18n="tt.format">Format</span>
    <div class="hud-bar" data-tt="format"><button data-v="mp4" class="on">MP4</button><button data-v="gif">GIF</button></div></div>
  <div class="tt-row"><span class="hud-sub" data-i18n="tt.length">Length</span>
    <div class="hud-bar" data-tt="len"><button data-v="6" class="on">6 s</button><button data-v="10">10 s</button></div></div>
  <div class="tt-row"><span class="hud-sub" data-i18n="tt.shape">Shape</span>
    <div class="hud-bar" data-tt="shape"><button data-v="square" class="on" data-i18n="tt.square">Square</button><button data-v="wide" data-i18n="tt.wide">Wide</button></div></div>
  <div class="tt-actions"><div class="hud-bar hud-chip"><button id="ttCancel" data-i18n="tt.cancel">Cancel</button><button id="ttGo" class="primary" data-testid="tt-record" data-i18n="tt.record">Record</button></div></div>
</div>

<div id="overlay"><div class="box hud-chip pad"><div id="msg" class="hud-title" data-i18n="viewer.loading">Loading splat…</div>
  <div class="progress"><i id="prog"></i></div><div class="hud-sub" id="sub">&nbsp;</div></div></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh, SplatEdit, SplatEditSdf, SplatEditSdfType, SplatEditRgbaBlendMode } from "@sparkjsdev/spark";

const $ = (id) => document.getElementById(id);
const t = window.t;
const params = new URLSearchParams(location.search);
const appMode = params.has("file");
if (appMode) document.body.classList.add("app");
window.i18n.mountSwitcher();
window.i18n.apply();

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---------------------------------------------------------------- config
async function loadConfig() {
  if (appMode) {
    const file = params.get("file");
    return { url: "/files/" + file.split("/").map(encodeURIComponent).join("/"), file,
             title: params.get("title") || file.split("/").pop(),
             rotation: store.get("rot:" + file), crop: store.get("crop:" + file) };
  }
  const r = await fetch("viewer-config.json");
  if (!r.ok) throw new Error(t("viewer.notFound"));
  const c = await r.json();
  return { url: c.file, file: c.file, title: c.title || c.file, rotation: c.rotation, crop: c.crop ?? null };
}

// ---------------------------------------------------------------- scene
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 1000);
const spark = new SparkRenderer({ renderer });
scene.add(spark);
const holder = new THREE.Group();          // orientation lives here, so the splat itself stays untouched
scene.add(holder);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotateSpeed = 1.2;

// Crop: an inverted sphere edit makes every splat outside the sphere fully transparent.
const cropEdit = new SplatEdit({ rgbaBlendMode: SplatEditRgbaBlendMode.MULTIPLY, invert: true, softEdge: 0 });
const cropSphere = new SplatEditSdf({ type: SplatEditSdfType.SPHERE, radius: 1, opacity: 0 });
cropEdit.add(cropSphere);
let cropFactor = null;                     // null = off; else radius as a multiple of the object's half-size

function bgLabel() { $("bg").textContent = document.documentElement.dataset.bg === "light" ? t("viewer.dark") : t("viewer.light"); }
function applyBackground() {
  const light = document.documentElement.dataset.bg === "light";
  renderer.setClearColor(light ? 0xefede7 : 0x0b0b0a, 1);
  bgLabel();
}
document.documentElement.dataset.bg = store.get("viewer:bg") || "dark";
applyBackground();
addEventListener("langchange", () => { bgLabel(); updateStats(); });

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); updateCoverage(); });

// ---------------------------------------------------------------- coverage globe (#28)
// Where the recording cameras were, as a small globe that turns with your view: each camera is a
// dot, the surface is shaded by how close the nearest camera came (red where none did), and the
// side facing you is the side of the model you're looking at. It uses the model's own coordinates
// and orientation, so it follows dragging, auto-rotate, Flip and Tilt alike.
let cov = null, covGlobe = null;
const GAP_DEG = 30;                        // no camera within this angle: a side the cameras missed
function cssColor(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return new THREE.Color(v || fallback);
}
function buildGlobe() {
  const dirs = (cov.coverage.dirs || []).map((d) => new THREE.Vector3(...d).normalize());
  const box = $("covGlobe");
  if (covGlobe) { covGlobe.renderer.dispose(); box.innerHTML = ""; }
  const size = Math.round(box.clientWidth || 140);
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(size, size, false);
  box.appendChild(r.domElement);
  const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
  const group = new THREE.Group(); sc.add(group);
  // the HUD is always dark: the dark theme's status colours, whatever the page theme
  const ok = new THREE.Color("#3ccf7d"), warn = new THREE.Color("#e0a43a"), bad = new THREE.Color("#ff6b5e");
  $("covKeyOk").style.background = "#" + ok.getHexString(); $("covKeyBad").style.background = "#" + bad.getHexString();
  // the surface: each point coloured by the angle to the nearest camera
  const geo = new THREE.IcosahedronGeometry(1, 5), pos = geo.attributes.position, cols = new Float32Array(pos.count * 3);
  const v = new THREE.Vector3(), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    let best = -1;
    for (const d of dirs) { const dot = v.dot(d); if (dot > best) best = dot; }
    const deg = Math.acos(Math.min(1, best)) * 180 / Math.PI;
    if (deg <= 12) c.copy(ok); else if (deg <= GAP_DEG) c.copy(ok).lerp(warn, (deg - 12) / (GAP_DEG - 12)); else c.copy(warn).lerp(bad, Math.min(1, (deg - GAP_DEG) / 15));
    cols.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute("color", new THREE.BufferAttribute(cols, 3));
  group.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true })));
  // the cameras, just above the surface: the solid ball hides the ones on the far side
  const pts = new THREE.BufferGeometry().setFromPoints(dirs.map((d) => d.clone().multiplyScalar(1.012)));
  group.add(new THREE.Points(pts, new THREE.PointsMaterial({ color: cssColor("--hud-ink", "#efede7"), size: 2.2, sizeAttenuation: false })));
  // an outline so the globe reads as a ball
  group.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.001, 1)),
    new THREE.LineBasicMaterial({ color: cssColor("--hud-ink-2", "#a8a49b"), transparent: true, opacity: 0.15 })));
  covGlobe = { renderer: r, scene: sc, camera: cam, group, dirs };
  $("covWho").textContent = cov.object ? "· " + cov.object : "";
}
const covTmp = { a: new THREE.Vector3(), b: new THREE.Vector3() };
let covState = null;
function viewDirection() {
  // from the model's centre towards you, in the model's own coordinates
  const p = holder.worldToLocal(covTmp.a.copy(camera.position));
  const tgt = holder.worldToLocal(covTmp.b.copy(controls.target));
  return p.sub(tgt).normalize();
}
function updateCoverage() {
  if (!cov || !covGlobe || $("covMap").hidden) return;
  const g = covGlobe;
  // the globe turns like the model, and is seen from where you are
  g.group.quaternion.copy(holder.quaternion);
  g.camera.position.copy(camera.position).sub(controls.target).normalize().multiplyScalar(4.2);
  g.camera.up.copy(camera.up); g.camera.lookAt(0, 0, 0);
  g.renderer.render(g.scene, g.camera);
  const d = viewDirection();
  let best = -1;
  for (const c of g.dirs) { const dot = d.dot(c); if (dot > best) best = dot; }
  const deg = Math.round(Math.acos(Math.min(1, best)) * 180 / Math.PI);
  const state = deg > GAP_DEG ? "gap" : "ok";
  if (state !== covState?.state || deg !== covState?.deg) {
    covState = { state, deg };
    $("covNote").className = "hud-sub" + (state === "gap" ? " warn" : "");
    $("covNote").textContent = state === "gap" ? t("viewer.coverage.gap") : t("viewer.coverage.ok");
    $("covMap").dataset.view = state;
  }
}
// Older runs are measured again on first view, which can take a while with several objects:
// the panel shows a spinner meanwhile and asks again until it's ready (#30).
let covAsk = null;
function askCoverage() {
  return fetch("/api/coverage?" + new URLSearchParams({ file: cfg.file }))
    .then((r) => (r.ok ? r.json() : { coverage: null, status: "failed" })).catch(() => ({ coverage: null, status: "failed" }));
}
function coverageState(state) {
  $("covMap").dataset.state = state;
  if (state === "loading") $("covWaitText").textContent = t("viewer.coverage.loading");
  if (state === "failed") $("covWaitText").textContent = t("viewer.coverage.failed");
  if (state !== "ready") { $("covNote").textContent = ""; $("covWho").textContent = ""; }
}
function showCoveragePanel() {
  $("covBtn").hidden = false;
  const on = store.get("viewer:coverage") !== false;
  $("covMap").hidden = !on; $("covBtn").classList.toggle("on", on);
  return on;
}
async function loadCoverage() {
  if (!appMode) return;
  let d = await (covAsk || askCoverage());
  if (d.status === "computing") {
    showCoveragePanel(); coverageState("loading");
    while (d.status === "computing") {
      await new Promise((r) => setTimeout(r, 1500));
      d = await askCoverage();
    }
  }
  if (!d.coverage || !(d.coverage.dirs || []).length) {
    if (d.status === "failed" && !$("covBtn").hidden) coverageState("failed");
    return;                                                   // nothing to show (no camera poses)
  }
  cov = d;
  coverageState("ready");
  if (showCoveragePanel()) buildGlobe();
  covState = null; updateCoverage();
}
$("covBtn").onclick = () => {
  const on = $("covMap").hidden;
  $("covMap").hidden = !on; $("covBtn").classList.toggle("on", on);
  store.set("viewer:coverage", on);
  if (on && cov && !covGlobe) buildGlobe();
  covState = null; updateCoverage();
};
addEventListener("langchange", () => {
  const st = $("covMap").dataset.state;
  if (st && st !== "ready") coverageState(st);
  covState = null; updateCoverage();
});

// ---------------------------------------------------------------- loading
async function fetchWithProgress(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(t("viewer.loadFailed", { url, status: res.status }));
  const total = +res.headers.get("Content-Length") || 0;
  const reader = res.body.getReader();
  const chunks = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    if (total) { $("prog").style.width = (100 * got / total).toFixed(1) + "%"; }
    $("sub").textContent = `${(got / 1e6).toFixed(1)}${total ? " / " + (total / 1e6).toFixed(1) : ""} MB`;
  }
  const out = new Uint8Array(got); let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}

// Brush writes the scene's up direction into the PLY header, as numbers or as a letter:
//   comment Vertical axis: 0.02 -0.99 0.05      or      comment Vertical axis: y
function upAxisFromPly(bytes) {
  const head = new TextDecoder("latin1").decode(bytes.subarray(0, Math.min(bytes.length, 65536)));
  const end = head.indexOf("end_header");
  if (!head.startsWith("ply") || end < 0) return null;
  const m = head.slice(0, end).match(/comment\s+Vertical axis:\s*([^\n\r]+)/);
  if (!m) return null;
  const nums = m[1].match(/[-+]?\d*\.?\d+(?:[eE][-+]?\d+)?/g);
  let v = null;
  if (nums && nums.length === 3) v = new THREE.Vector3(+nums[0], +nums[1], +nums[2]);
  else v = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) }[m[1].trim().toLowerCase()] || null;
  return v && v.lengthSq() > 1e-8 ? v.normalize() : null;
}

let mesh, cfg, up = null, defaultQuat = new THREE.Quaternion(), fit = null, nBytes = 0;

// Frame the camera on the object: the bulk of the *opaque* splats. Background "fog" is
// mostly faint splats, so it no longer drags the camera into the cloud.
function computeFit() {
  holder.updateMatrixWorld(true);
  const m = holder.matrixWorld, n = mesh.numSplats || 0;
  const stride = Math.max(1, Math.floor(n / 150000));
  const pts = { 0.5: [[], [], []], 0.15: [[], [], []] }, p = new THREE.Vector3();
  mesh.forEachSplat((i, center, _s, _q, opacity) => {
    if (i % stride || opacity < 0.15) return;
    p.copy(center).applyMatrix4(m);
    for (const th of [0.5, 0.15]) if (opacity >= th) { pts[th][0].push(p.x); pts[th][1].push(p.y); pts[th][2].push(p.z); }
  });
  const sampled = Math.ceil(n / stride);
  const use = pts[0.5][0].length >= Math.max(10, 0.05 * sampled) ? pts[0.5] : pts[0.15];
  if (use[0].length < 10) {
    const box = mesh.getBoundingBox(true).applyMatrix4(m);
    return { center: box.getCenter(new THREE.Vector3()), size: box.getSize(new THREE.Vector3()).length() || 1 };
  }
  const pct = (a, q) => { a.sort((x, y) => x - y); return a[Math.floor(q * (a.length - 1))]; };
  const lo = new THREE.Vector3(pct(use[0], .05), pct(use[1], .05), pct(use[2], .05));
  const hi = new THREE.Vector3(pct(use[0], .95), pct(use[1], .95), pct(use[2], .95));
  return { center: lo.clone().add(hi).multiplyScalar(.5), size: hi.clone().sub(lo).length() || 1 };
}

function applyCrop() {
  const on = cropFactor != null && fit;
  $("crop").classList.toggle("on", !!on);
  $("cropRange").hidden = !on;
  if (!on) { scene.remove(cropEdit); return; }
  cropSphere.position.copy(fit.center);
  cropSphere.radius = (fit.size / 2) * cropFactor;
  if (!cropEdit.parent) scene.add(cropEdit);
  $("cropRange").value = Math.round(cropFactor * 100);
}

function resetView() {
  fit = computeFit();
  const { center, size } = fit;
  camera.near = size / 500; camera.far = size * 50; camera.updateProjectionMatrix();
  const dist = size * 0.95 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.8;   // with a margin
  camera.position.copy(center).add(new THREE.Vector3(0.0, 0.32, 1).normalize().multiplyScalar(dist));
  controls.target.copy(center);
  controls.minDistance = size * 0.05; controls.maxDistance = size * 8;
  controls.update();
  applyCrop();
}

function rotateBy(axis, deg) {
  const q = new THREE.Quaternion().setFromAxisAngle(axis, THREE.MathUtils.degToRad(deg));
  holder.quaternion.premultiply(q);
  resetView();
}

function updateStats() {
  if (!mesh) return;
  $("stats").textContent = t("viewer.stats", { n: (mesh.numSplats || 0).toLocaleString(), mb: (nBytes / 1e6).toFixed(1) })
    + (up ? "" : t("viewer.noUp"));
}

async function main() {
  cfg = await loadConfig();
  if (appMode) covAsk = askCoverage();          // measuring may take a while: start alongside the splat
  document.title = cfg.title + " – Splat Viewer";
  $("title").removeAttribute("data-i18n");
  $("title").textContent = cfg.title;
  const bytes = await fetchWithProgress(cfg.url);
  nBytes = bytes.length;
  $("msg").removeAttribute("data-i18n");
  $("msg").textContent = t("viewer.decoding"); $("sub").textContent = "";
  up = upAxisFromPly(bytes);
  if (up) defaultQuat.setFromUnitVectors(up, new THREE.Vector3(0, 1, 0));
  else defaultQuat.set(1, 0, 0, 0);       // COLMAP-style data is usually y-down: flip by default
  mesh = new SplatMesh({ fileBytes: bytes, fileName: cfg.file });
  holder.add(mesh);
  await mesh.initialized;
  if (Array.isArray(cfg.rotation) && cfg.rotation.length === 4) holder.quaternion.fromArray(cfg.rotation);
  else holder.quaternion.copy(defaultQuat);
  cropFactor = typeof cfg.crop === "number" && cfg.crop > 0 ? cfg.crop : null;
  resetView();
  // read-only status + helpers, used by the automated tests and the demo-filming script
  window.splatViewer = {
    numSplats: () => mesh.numSplats || 0,
    worldUp: () => (up || new THREE.Vector3(0, -1, 0)).clone().applyQuaternion(holder.quaternion).toArray(),
    fitSize: () => fit.size,
    fitCenter: () => fit.center.toArray(),
    cropRadius: () => (cropFactor == null ? null : cropSphere.radius),
    orbit: (deg) => {
      const off = camera.position.clone().sub(controls.target);
      off.applyAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(deg));
      camera.position.copy(controls.target).add(off); controls.update();
    },
    turntable: (opts) => recordTurntable(opts),
    coverageView: () => (cov ? { view: $("covMap").dataset.view || null, nearest: covState?.deg ?? null, object: cov.object } : null),
  };
  updateStats();
  $("overlay").style.display = "none";
  loadCoverage();
}

// ---------------------------------------------------------------- turntable video (#13)
// One frame per step of a full circle, rendered at the output size and sent as JPEGs; the server
// turns them into an MP4 or GIF. A fixed step per frame keeps the length exact on any computer.
const ttPick = (k) => document.querySelector(`[data-tt="${k}"] button.on`)?.dataset.v;
document.querySelectorAll("[data-tt]").forEach((g) => g.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  g.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
}));
const nextFrame = () => new Promise((r) => requestAnimationFrame(r));
async function recordTurntable({ format = "mp4", seconds = 6, width, height }) {
  const fps = format === "gif" ? 15 : 30, n = Math.max(2, Math.round(fps * seconds));
  const canvas = renderer.domElement, saved = { pos: camera.position.clone(), aspect: camera.aspect,
    ratio: renderer.getPixelRatio(), spin: controls.autoRotate };
  const off = camera.position.clone().sub(controls.target), axis = new THREE.Vector3(0, 1, 0);
  renderer.setAnimationLoop(null); controls.autoRotate = false;
  renderer.setPixelRatio(1); renderer.setSize(width, height, false);
  camera.aspect = width / height; camera.updateProjectionMatrix();
  $("overlay").style.display = ""; $("prog").parentElement.style.display = "";
  $("msg").removeAttribute("data-i18n");
  const parts = [];
  try {
    camera.position.copy(controls.target).add(off); camera.lookAt(controls.target);
    for (let k = 0; k < 8; k++) { renderer.render(scene, camera); await nextFrame(); }   // warm up at the new size
    for (let i = 0; i < n; i++) {
      camera.position.copy(controls.target).add(off.clone().applyAxisAngle(axis, 2 * Math.PI * i / n));
      camera.lookAt(controls.target);
      renderer.render(scene, camera); await nextFrame();     // let the splat order settle for this view
      renderer.render(scene, camera); await nextFrame();
      parts.push(await new Promise((res) => { renderer.render(scene, camera); canvas.toBlob(res, "image/jpeg", 0.9); }));
      $("msg").textContent = t("tt.recording", { pct: Math.round(100 * (i + 1) / n) });
      $("prog").style.width = (100 * (i + 1) / n) + "%";
    }
  } finally {
    camera.position.copy(saved.pos); camera.aspect = saved.aspect; camera.updateProjectionMatrix();
    renderer.setPixelRatio(saved.ratio); renderer.setSize(innerWidth, innerHeight);
    controls.autoRotate = saved.spin; controls.update();
    renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); updateCoverage(); });
  }
  $("msg").textContent = t("tt.encoding"); $("prog").style.width = "100%";
  const q = new URLSearchParams({ file: cfg.file, format, fps: String(fps) });
  const r = await fetch("/api/turntable?" + q, { method: "POST", body: new Blob(parts, { type: "application/octet-stream" }) });
  const d = await r.json().catch(() => ({}));
  $("overlay").style.display = "none";
  if (!r.ok) throw new Error(d.code && window.i18n.has("err." + d.code) ? t("err." + d.code) : (d.error || r.statusText));
  return d;
}
$("turntable").onclick = () => { $("ttPanel").hidden = !$("ttPanel").hidden; };
$("ttCancel").onclick = () => { $("ttPanel").hidden = true; };
$("ttGo").onclick = async () => {
  if (!mesh) return;
  $("ttPanel").hidden = true;
  const format = ttPick("format"), wide = ttPick("shape") === "wide", gif = format === "gif";
  const [width, height] = wide ? (gif ? [800, 450] : [1920, 1080]) : (gif ? [600, 600] : [1080, 1080]);
  try {
    const d = await recordTurntable({ format, seconds: +ttPick("len"), width, height });
    location.href = "/files/" + d.file.split("/").map(encodeURIComponent).join("/") + "?download=1";
  } catch (e) {
    $("overlay").style.display = "";
    $("prog").parentElement.style.display = "none";
    $("msg").innerHTML = `<div class="err">${String(e.message || e).replace(/[<>&]/g, "")}</div>`;
    setTimeout(() => ($("overlay").style.display = "none"), 4000);
  }
};

// ---------------------------------------------------------------- controls
$("reset").onclick = () => mesh && resetView();
$("spin").onclick = () => { controls.autoRotate = !controls.autoRotate; $("spin").classList.toggle("on", controls.autoRotate); };
$("flip").onclick = () => mesh && rotateBy(new THREE.Vector3(1, 0, 0), 180);
$("rotx").onclick = () => mesh && rotateBy(new THREE.Vector3(1, 0, 0), 90);
$("rotz").onclick = () => mesh && rotateBy(new THREE.Vector3(0, 0, 1), 90);
$("crop").onclick = () => { if (!mesh) return; cropFactor = cropFactor == null ? 1.2 : null; applyCrop(); };
$("cropRange").oninput = (e) => { cropFactor = +e.target.value / 100; applyCrop(); };
$("bg").onclick = () => {
  const d = document.documentElement;
  d.dataset.bg = d.dataset.bg === "light" ? "dark" : "light";
  store.set("viewer:bg", d.dataset.bg); applyBackground();
};
$("full").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
$("save").onclick = () => {
  store.set("rot:" + cfg.file, holder.quaternion.toArray());
  store.set("crop:" + cfg.file, cropFactor);
  $("save").textContent = t("viewer.saved"); setTimeout(() => ($("save").textContent = t("viewer.save")), 1500);
};
$("download").onclick = () => { location.href = cfg.url + "?download=1"; };
$("export").onclick = () => {
  const q = new URLSearchParams({ file: cfg.file, title: cfg.title, rotation: JSON.stringify(holder.quaternion.toArray()) });
  if (cropFactor != null) q.set("crop", String(cropFactor));
  location.href = "/api/export?" + q;
};
addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "r" || e.key === "R") $("reset").click();
  if (e.key === "a" || e.key === "A") $("spin").click();
});

main().catch((e) => {
  console.error(e);
  $("msg").removeAttribute("data-i18n");
  $("msg").innerHTML = `<div class="err">${String(e.message || e).replace(/[<>&]/g, "")}</div>`;
  $("prog").parentElement.style.display = "none";
});
</script>
</body>
</html>
